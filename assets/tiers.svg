<svg xmlns="http://www.w3.org/2000/svg" width="960" height="698" viewBox="0 0 960 698" role="img" aria-labelledby="t d">
  <title id="t">Who owns the decision picks the model</title>
  <desc id="d">Opus: decide, synth, design, and judge for reviews with findings; at most 3 at once. Sonnet: investigate (never Opus), build (decided work that leaves details open), fix and combine (Opus also allowed), judge as one yes/no review, and the simpler agents of a fan-out of more than 3. Haiku, never at xhigh: code at medium for fully specified implementation, grunt at medium or high for fixed-shape checkable work (Sonnet also allowed).</desc>
  <rect x="0.5" y="0.5" width="959" height="697" rx="16" fill="#16161a" stroke="#2a2a31"/>
  <text x="24" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e4e4e7">Who owns the decision picks the model</text>
  <text x="24" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Every <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">agent()</tspan> label starts with a class. The class sets which models and efforts the gate allows.</text>
  <rect x="24" y="92" width="296" height="480" rx="12" fill="#1e1e24" stroke="#e2484f" stroke-opacity="0.4"/>
  <text x="44" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2484f">Opus</text>
  <text x="44" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Judgment: decisions, design, reviews</text>
  <rect x="200" y="112" width="100" height="26" rx="13" fill="none" stroke="#e2484f" stroke-width="1.2"/>
  <text x="250.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2484f">≤ 3 at once</text>
  <line x1="24" y1="170" x2="320" y2="170" stroke="#e2484f" stroke-opacity="0.25"/>
  <rect x="336" y="92" width="320" height="480" rx="12" fill="#1e1e24" stroke="#f48815" stroke-opacity="0.4"/>
  <text x="356" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f48815">Sonnet</text>
  <text x="356" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Investigation and decided work</text>
  <rect x="500" y="112" width="136" height="26" rx="13" fill="none" stroke="#f48815" stroke-width="1.2"/>
  <text x="568.0" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#f48815">any fan-out size</text>
  <line x1="336" y1="170" x2="656" y2="170" stroke="#f48815" stroke-opacity="0.25"/>
  <rect x="672" y="92" width="264" height="480" rx="12" fill="#1e1e24" stroke="#efb219" stroke-opacity="0.4"/>
  <text x="692" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#efb219">Haiku</text>
  <text x="692" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Fully specified, checkable work</text>
  <rect x="783" y="112" width="133" height="26" rx="13" fill="none" stroke="#efb219" stroke-width="1.2"/>
  <text x="849.5" y="129.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#efb219">never xhigh</text>
  <line x1="672" y1="170" x2="936" y2="170" stroke="#efb219" stroke-opacity="0.25"/>
  <text x="44" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2484f">decide:</text>
  <text x="44" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Any open choice: approach, software</text>
  <text x="44" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">design, taste, unclear bugs</text>
  <line x1="44" y1="244" x2="300" y2="244" stroke="#2a2a31"/>
  <text x="44" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2484f">synth:</text>
  <text x="44" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Complex, distributed or conflicting work</text>
  <line x1="44" y1="300" x2="300" y2="300" stroke="#2a2a31"/>
  <text x="44" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2484f">design:</text>
  <text x="44" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Visual and UI design</text>
  <line x1="44" y1="356" x2="300" y2="356" stroke="#2a2a31"/>
  <text x="44" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2484f">judge:</text>
  <text x="44" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Reviews with findings lists, scores</text>
  <text x="44" y="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">or several verdicts</text>
  <text x="356" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">investigate:</text>
  <text x="636" y="194" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#a1a1aa">never opus</text>
  <text x="356" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Research, code mapping, any reading</text>
  <text x="356" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">that reports findings</text>
  <line x1="356" y1="244" x2="636" y2="244" stroke="#2a2a31"/>
  <text x="356" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">build:</text>
  <text x="636" y="268" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2484f">or opus</text>
  <text x="356" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Decided work that leaves details open</text>
  <line x1="356" y1="300" x2="636" y2="300" stroke="#2a2a31"/>
  <text x="356" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">fix:</text>
  <text x="636" y="324" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2484f">or opus</text>
  <text x="356" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Known-cause fixes, not file by file</text>
  <line x1="356" y1="356" x2="636" y2="356" stroke="#2a2a31"/>
  <text x="356" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">combine:</text>
  <text x="636" y="380" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2484f">or opus</text>
  <text x="356" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Merging groundwork toward one goal</text>
  <line x1="356" y1="412" x2="636" y2="412" stroke="#2a2a31"/>
  <text x="356" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">judge:</text>
  <text x="356" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">One yes/no review, schema exactly</text>
  <text x="356" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa"><tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">pass</tspan>, <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">evidence</tspan>, <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">blocked_on</tspan></text>
  <line x1="356" y1="486" x2="636" y2="486" stroke="#2a2a31"/>
  <text x="356" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#f48815">decide: synth: design:</text>
  <text x="356" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">The simpler agents of a fan-out of</text>
  <text x="356" y="548" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">more than 3 at once, or of unknown size</text>
  <text x="692" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#efb219">code:</text>
  <text x="916" y="194" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#f48815">or sonnet</text>
  <text x="692" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Files, interfaces and tests named;</text>
  <text x="692" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Haiku medium only</text>
  <line x1="692" y1="244" x2="916" y2="244" stroke="#2a2a31"/>
  <text x="692" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#efb219">grunt:</text>
  <text x="916" y="268" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#f48815">or sonnet</text>
  <text x="692" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Zero-decision work: tabulate,</text>
  <text x="692" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">count, extract, run a check</text>
  <text x="692" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Haiku medium or high</text>
  <rect x="40" y="444" width="264" height="104" rx="10" fill="#16161a" stroke="#2a2a31"/>
  <circle cx="60" cy="465" r="5" fill="#e2484f"/>
  <circle cx="74" cy="465" r="5" fill="#e2484f"/>
  <circle cx="88" cy="465" r="5" fill="#e2484f"/>
  <text x="102" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">At most 3 Opus at once</text>
  <text x="54" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Counted from the script.</text>
  <text x="54" y="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Wider fan-out: the 3 most complex</text>
  <text x="54" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">on Opus, the rest on Sonnet.</text>
  <rect x="688" y="444" width="232" height="104" rx="10" fill="#16161a" stroke="#2a2a31"/>
  <text x="702" y="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e4e4e7">Nothing left to decide</text>
  <text x="702" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Only when the prompt leaves</text>
  <text x="702" y="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">nothing to decide. No xhigh.</text>
  <text x="702" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Names or state open: build:.</text>
  <line x1="304" y1="520" x2="348" y2="520" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M343 515.5 L349 520 L343 524.5" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="606" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e4e4e7">blocked_on</text>
  <text x="112" y="606" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">Every Sonnet and Haiku stage reports an open decision instead of making it. The orchestrating session settles it.</text>
  <text x="24" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e4e4e7">LABEL</text>
  <text x="112" y="628" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">A <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">decide:</tspan>, <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">judge:</tspan> or <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">design:</tspan> label, or a fanned-out <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">synth:</tspan> label, with research, map,</text>
  <text x="112" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">audit… in it is denied: that work is <tspan fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">investigate:</tspan>.</text>
  <text x="24" y="672" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e4e4e7">effort</text>
  <text x="112" y="672" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a1a1aa">medium, high or xhigh. Never low or max. Haiku never runs xhigh.</text>
</svg>
